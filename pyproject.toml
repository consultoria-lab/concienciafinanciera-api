[project]
name = "concienciafinanciera-api"
version = "0.1.0"
description = "API de extraccion con LLM para ConCiencia Financiera"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "langchain-openai",
    "openai",
    "supabase",
    "pydantic-settings",
    "pymupdf",
    "python-dotenv",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
